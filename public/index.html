
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Viewer</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 650px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 { font-size: 32px; }

    .subtitle { color: #666; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-top: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    button {
      background: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .details {
      padding: 16px;
      margin-top: 20px;
      background: #f5f5f7;
      border-radius: 10px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    code {
      font-size: 12px;
      word-break: break-all;
    }

    .secret {
      user-select: all;
    }

    .status {
      margin-top: 20px;
      color: #555;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>File Viewer</h1>
    <p class="subtitle">
      Send files from your phone to your computer.
    </p>

    <div class="card">
      <div id="device-selection">
        <h2>Choose your device</h2>

        <button id="computer-button">
          I'm on my computer
        </button>

        <button id="phone-button">
          I'm on my phone
        </button>
      </div>

      <div id="computer-view" hidden>
        <h2>Computer pairing</h2>

        <p>Enter these details on your phone.</p>

        <div class="details">
          <p><strong>Session ID</strong></p>
          <code id="session-id"></code>

          <p><strong>Pairing token</strong></p>
          <code id="pairing-token" class="secret"></code>

          <p><strong>Expires</strong></p>
          <span id="session-expiry"></span>
        </div>
      </div>

      <div id="phone-view" hidden>
        <h2>Connect to computer</h2>

        <form id="pairing-form">
          <input
            id="phone-session-id"
            type="text"
            placeholder="Session ID"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            required
          >

          <input
            id="phone-token"
            type="text"
            placeholder="Pairing token"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            required
          >

          <button id="join-button" type="submit">
            Connect
          </button>
        </form>
      </div>

      <p id="status" class="status">
        Waiting for selection...
      </p>

      <button id="back-button" hidden>
        Back
      </button>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    let currentSession = null;
    
    let statusInterval = null;

    async function checkPairingStatus() {
      if (!currentSession) return;

      try {
        const response = await fetch(
          `/api/sessions/${currentSession.sessionId}/status`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              pairingToken: currentSession.pairingToken
            }),
            cache: "no-store"
          }
        );

        if (!response.ok) {
          stopStatusPolling();
          $("status").textContent =
            "Session expired or unavailable.";
          return;
        }

        const result = await response.json();

        if (result.joined) {
          stopStatusPolling();
          $("status").textContent =
            "✅ Phone connected successfully!";
        }

      } catch (error) {
        console.error("Status check failed:", error);
      }
    }

    function startStatusPolling() {
      stopStatusPolling();

      checkPairingStatus();

      statusInterval = setInterval(
        checkPairingStatus,
        3000
      );
    }

    function stopStatusPolling() {
      if (statusInterval !== null) {
        clearInterval(statusInterval);
        statusInterval = null;
      }
    }


    function showView(view) {
      $("device-selection").hidden = view !== "selection";
      $("computer-view").hidden = view !== "computer";
      $("phone-view").hidden = view !== "phone";
      $("back-button").hidden = view === "selection";
    }

    $("computer-button").addEventListener("click", async () => {
      $("computer-button").disabled = true;
      $("status").textContent = "Creating session...";

      try {
        const response = await fetch("/api/sessions", {
          method: "POST",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Could not create session");
        }

        currentSession = await response.json();

        $("session-id").textContent =
          currentSession.sessionId;

        $("pairing-token").textContent =
          currentSession.pairingToken;

        $("session-expiry").textContent =
          new Date(currentSession.expiresAt).toLocaleTimeString();

        showView("computer");
        $("status").textContent =
          "Session ready. Open File Viewer on your phone.";

        startStatusPolling();

      } catch (error) {
        $("status").textContent =
          "Session creation failed. Please try again.";
        console.error(error);
      } finally {
        $("computer-button").disabled = false;
      }
    });

    $("phone-button").addEventListener("click", () => {
      showView("phone");
      $("status").textContent =
        "Enter the pairing details from your computer.";
    });

    $("pairing-form").addEventListener("submit", async event => {
      event.preventDefault();

      const sessionId =
        $("phone-session-id").value.trim().toLowerCase();

      const pairingToken =
        $("phone-token").value.trim().toLowerCase();

      const button = $("join-button");
      button.disabled = true;

      $("status").textContent = "Connecting...";

      try {
        const response = await fetch(
          `/api/sessions/${encodeURIComponent(sessionId)}/join`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ pairingToken }),
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error("Pairing failed");
        }

        $("status").textContent =
          "Success! Your phone has joined the pairing session.";

        $("pairing-form").hidden = true;

        // Temporary test: this is not yet a WebRTC connection.
      } catch (error) {
        $("status").textContent =
          "Could not pair. Check the details and try again.";
        button.disabled = false;
        console.error(error);
      }
    });

    $("back-button").addEventListener("click", () => {
      stopStatusPolling();
      currentSession = null;
      $("pairing-form").reset();
      $("pairing-form").hidden = false;
      $("status").textContent = "Waiting for selection...";
      showView("selection");
    });
  </script>
</body>
</html>
