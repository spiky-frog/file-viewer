
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 650px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
    }

    .subtitle {
      color: #666;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-top: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    button {
      background: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px;
    }

    button:hover {
      background: #0066d6;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .details {
      padding: 16px;
      margin-top: 20px;
      background: #f5f5f7;
      border-radius: 10px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .details p {
      margin: 12px 0 6px;
    }

    code {
      font-size: 12px;
      word-break: break-all;
    }

    .secret {
      user-select: all;
    }

    .status {
      margin-top: 20px;
      color: #555;
      overflow-wrap: anywhere;
    }

    .success {
      color: #16803c;
      font-weight: 600;
    }

    .error {
      color: #c62828;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .container {
        margin: 30px auto;
        padding: 15px;
      }

      .card {
        padding: 20px;
      }

      button {
        width: 100%;
        margin: 8px 0;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>File Viewer</h1>

    <p class="subtitle">
      Send files from your phone to your computer.
    </p>

    <div class="card">

      <!-- Device selection -->
      <div id="device-selection">
        <h2>Choose your device</h2>

        <button id="computer-button">
          I'm on my computer
        </button>

        <button id="phone-button">
          I'm on my phone
        </button>
      </div>

      <!-- Computer interface -->
      <div id="computer-view" hidden>
        <h2>Computer pairing</h2>

        <p>Enter these details on your phone.</p>

        <div class="details">
          <p><strong>Session ID</strong></p>
          <code id="session-id"></code>

          <p><strong>Pairing token</strong></p>
          <code id="pairing-token" class="secret"></code>

          <p><strong>Expires</strong></p>
          <span id="session-expiry"></span>
        </div>
      </div>

      <!-- Phone interface -->
      <div id="phone-view" hidden>
        <h2>Connect to computer</h2>

        <form id="pairing-form">
          <input
            id="phone-session-id"
            type="text"
            placeholder="Session ID"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            required
          >

          <input
            id="phone-token"
            type="text"
            placeholder="Pairing token"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            required
          >

          <button id="join-button" type="submit">
            Connect
          </button>
        </form>
      </div>

      <!-- Status -->
      <p
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      >
        Waiting for selection...
      </p>

      <button id="back-button" hidden>
        Back
      </button>

    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    let currentSession = null;
    let phoneSession = null;

    let pairingSocket = null;
    let phoneSocket = null;

    // Prevent outdated asynchronous operations
    // from changing the current interface.
    let viewGeneration = 0;

    function showView(view) {
      $("device-selection").hidden = view !== "selection";
      $("computer-view").hidden = view !== "computer";
      $("phone-view").hidden = view !== "phone";
      $("back-button").hidden = view === "selection";
    }

    function setStatus(message, type = "") {
      const status = $("status");

      status.textContent = message;
      status.className = "status";

      if (type === "success") {
        status.classList.add("success");
      }

      if (type === "error") {
        status.classList.add("error");
      }
    }

    function websocketURL(sessionId) {
      const protocol =
        location.protocol === "https:" ? "wss:" : "ws:";

      return (
        `${protocol}//${location.host}` +
        `/api/sessions/${sessionId}/ws`
      );
    }

    // Close the computer's WebSocket.
    function disconnectComputerSocket() {
      if (pairingSocket) {
        const socket = pairingSocket;
        pairingSocket = null;
        socket.close();
      }
    }

    // Close the phone's WebSocket.
    function disconnectPhoneSocket() {
      if (phoneSocket) {
        const socket = phoneSocket;
        phoneSocket = null;
        socket.close();
      }
    }

    // Computer WebSocket connection
    function connectComputerSocket() {
      if (!currentSession) return;

      disconnectComputerSocket();

      const session = currentSession;

      const socket = new WebSocket(
        websocketURL(session.sessionId),
        [
          "file-viewer",
          `token.${session.ownerToken}`
        ]
      );

      pairingSocket = socket;

      setStatus("Connecting to pairing service...");

      socket.onopen = () => {
        if (pairingSocket !== socket) return;

        setStatus(
          "Ready! Open File Viewer on your phone."
        );
      };

      socket.onmessage = event => {
        if (pairingSocket !== socket) return;

        try {
          const message = JSON.parse(event.data);

          if (
            message.type === "phone-joined" ||
            (
              message.type === "session-status" &&
              message.joined
            )
          ) {
            setStatus(
              "Phone paired successfully!",
              "success"
            );
          }

        } catch (error) {
          console.error(
            "Invalid computer WebSocket message:",
            error
          );
        }
      };

      socket.onerror = error => {
        if (pairingSocket !== socket) return;

        console.error(
          "Computer WebSocket error:",
          error
        );
      };

      socket.onclose = () => {
        if (pairingSocket !== socket) return;

        pairingSocket = null;

        setStatus(
          "Computer connection closed. Create a new session.",
          "error"
        );
      };
    }

    // Phone WebSocket connection
    function connectPhoneSocket() {
      if (!phoneSession) return;

      disconnectPhoneSocket();

      const session = phoneSession;

      const socket = new WebSocket(
        websocketURL(session.sessionId),
        [
          "file-viewer",
          `token.${session.phoneToken}`
        ]
      );

      phoneSocket = socket;

      setStatus(
        "Pairing accepted. Establishing real-time connection..."
      );

      socket.onopen = () => {
        if (phoneSocket !== socket) return;

        setStatus(
          "Connected to pairing service!",
          "success"
        );
      };

      socket.onmessage = event => {
        if (phoneSocket !== socket) return;

        try {
          const message = JSON.parse(event.data);

          if (
            message.type === "session-status" &&
            message.role === "phone"
          ) {
            setStatus(
              "Phone WebSocket authenticated successfully!",
              "success"
            );
          }

        } catch (error) {
          console.error(
            "Invalid phone WebSocket message:",
            error
          );
        }
      };

      socket.onerror = error => {
        if (phoneSocket !== socket) return;

        console.error(
          "Phone WebSocket error:",
          error
        );
      };

      socket.onclose = () => {
        if (phoneSocket !== socket) return;

        phoneSocket = null;

        setStatus(
          "Phone connection closed. Create a new pairing session.",
          "error"
        );
      };
    }

    // Computer creates pairing session
    $("computer-button").addEventListener(
      "click",
      async () => {
        const generation = viewGeneration;
        const button = $("computer-button");

        button.disabled = true;
        setStatus("Creating pairing session...");

        try {
          const response = await fetch("/api/sessions", {
            method: "POST",
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error("Could not create session");
          }

          const session = await response.json();

          if (generation !== viewGeneration) return;

          currentSession = session;

          $("session-id").textContent =
            session.sessionId;

          $("pairing-token").textContent =
            session.pairingToken;

          $("session-expiry").textContent =
            new Date(
              session.expiresAt
            ).toLocaleTimeString();

          showView("computer");
          connectComputerSocket();

        } catch (error) {
          if (generation !== viewGeneration) return;

          console.error(error);

          setStatus(
            "Session creation failed. Please try again.",
            "error"
          );
        } finally {
          button.disabled = false;
        }
      }
    );

    // Phone mode
    $("phone-button").addEventListener("click", () => {
      showView("phone");

      setStatus(
        "Enter the pairing details from your computer."
      );
    });

    // Phone joins pairing session
    $("pairing-form").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const generation = viewGeneration;

        const sessionId =
          $("phone-session-id")
            .value.trim().toLowerCase();

        const pairingToken =
          $("phone-token")
            .value.trim().toLowerCase();

        const button = $("join-button");

        button.disabled = true;

        setStatus("Pairing with computer...");

        try {
          const response = await fetch(
            `/api/sessions/${encodeURIComponent(sessionId)}/join`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                pairingToken
              }),
              cache: "no-store"
            }
          );

          if (!response.ok) {
            throw new Error("Pairing failed");
          }

          const result = await response.json();

          if (generation !== viewGeneration) return;

          if (
            !result.success ||
            typeof result.phoneToken !== "string" ||
            !/^[0-9a-f]{64}$/.test(result.phoneToken)
          ) {
            throw new Error("Invalid pairing response");
          }

          // Store phone credential in memory only.
          phoneSession = {
            sessionId,
            phoneToken: result.phoneToken
          };

          // Hide the form and clear its secrets.
          $("pairing-form").hidden = true;
          $("pairing-form").reset();

          // Authenticate the phone's WebSocket.
          connectPhoneSocket();

        } catch (error) {
          if (generation !== viewGeneration) return;

          console.error(error);

          setStatus(
            "Could not connect. Check the pairing details.",
            "error"
          );

          button.disabled = false;
        }
      }
    );

    // Return to device selection
    $("back-button").addEventListener("click", () => {
      viewGeneration++;

      disconnectComputerSocket();
      disconnectPhoneSocket();

      currentSession = null;
      phoneSession = null;

      $("session-id").textContent = "";
      $("pairing-token").textContent = "";
      $("session-expiry").textContent = "";

      $("pairing-form").reset();
      $("pairing-form").hidden = false;
      $("join-button").disabled = false;

      setStatus("Waiting for selection...");
      showView("selection");
    });

    // Close connections when leaving the website.
    window.addEventListener("pagehide", () => {
      disconnectComputerSocket();
      disconnectPhoneSocket();
    });
  </script>
</body>
</html>
