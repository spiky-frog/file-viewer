
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 650px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
    }

    .subtitle {
      color: #666;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-top: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    button {
      background: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px;
    }

    button:hover {
      background: #0066d6;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .details {
      padding: 16px;
      margin-top: 20px;
      background: #f5f5f7;
      border-radius: 10px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .details p {
      margin: 12px 0 6px;
    }

    code {
      font-size: 12px;
      word-break: break-all;
    }

    .secret {
      user-select: all;
    }

    .status {
      margin-top: 20px;
      color: #555;
      overflow-wrap: anywhere;
    }

    .success {
      color: #16803c;
      font-weight: 600;
    }

    .error {
      color: #c62828;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .container {
        margin: 30px auto;
        padding: 15px;
      }

      .card {
        padding: 20px;
      }

      button {
        width: 100%;
        margin: 8px 0;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>File Viewer</h1>

    <p class="subtitle">
      Send files from your phone to your computer.
    </p>

    <div class="card">

      <!-- Device selection -->
      <div id="device-selection">
        <h2>Choose your device</h2>

        <button id="computer-button">
          I'm on my computer
        </button>

        <button id="phone-button">
          I'm on my phone
        </button>
      </div>

      <!-- Computer interface -->
      <div id="computer-view" hidden>
        <h2>Computer pairing</h2>

        <p>Enter these details on your phone.</p>

        <div class="details">
          <p><strong>Session ID</strong></p>
          <code id="session-id"></code>

          <p><strong>Pairing token</strong></p>
          <code id="pairing-token" class="secret"></code>

          <p><strong>Expires</strong></p>
          <span id="session-expiry"></span>
        </div>
      </div>

      <!-- Phone interface -->
      <div id="phone-view" hidden>
        <h2>Connect to computer</h2>

        <form id="pairing-form">
          <input
            id="phone-session-id"
            type="text"
            placeholder="Session ID"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            required
          >

          <input
            id="phone-token"
            type="text"
            placeholder="Pairing token"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            required
          >

          <button id="join-button" type="submit">
            Connect
          </button>
        </form>
      </div>

      <!-- Status -->
      <p id="status" class="status" role="status" aria-live="polite">
        Waiting for selection...
      </p>

      <button id="back-button" hidden>
        Back
      </button>

    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    let currentSession = null;
    let pairingSocket = null;

    // Switch between device interfaces
    function showView(view) {
      $("device-selection").hidden = view !== "selection";
      $("computer-view").hidden = view !== "computer";
      $("phone-view").hidden = view !== "phone";
      $("back-button").hidden = view === "selection";
    }

    function setStatus(message, type = "") {
      const status = $("status");

      status.textContent = message;
      status.className = "status";

      if (type === "success") {
        status.classList.add("success");
      }

      if (type === "error") {
        status.classList.add("error");
      }
    }

    // Close the existing WebSocket connection
    function disconnectWebSocket() {
      if (pairingSocket) {
        const socket = pairingSocket;
        pairingSocket = null;
        socket.close();
      }
    }

    // Connect computer to its Durable Object room
    function connectWebSocket() {
      if (!currentSession) return;

      disconnectWebSocket();

      const session = currentSession;

      const protocol =
        location.protocol === "https:" ? "wss:" : "ws:";

      const url =
        `${protocol}//${location.host}` +
        `/api/sessions/${session.sessionId}/ws`;

      const socket = new WebSocket(url, [
        "file-viewer",
        `token.${session.ownerToken}`
      ]);

      pairingSocket = socket;

      setStatus("Connecting to pairing service...");

      socket.onopen = () => {
        if (pairingSocket !== socket) return;

        setStatus(
          "Ready! Open File Viewer on your phone."
        );
      };

      socket.onmessage = event => {
        if (pairingSocket !== socket) return;

        try {
          const message = JSON.parse(event.data);

          if (
            message.type === "phone-joined" ||
            (
              message.type === "session-status" &&
              message.joined
            )
          ) {
            setStatus(
              "Phone connected successfully!",
              "success"
            );
          }

        } catch (error) {
          console.error(
            "Invalid WebSocket message:",
            error
          );
        }
      };

      socket.onerror = error => {
        if (pairingSocket !== socket) return;

        console.error("WebSocket error:", error);
      };

      socket.onclose = () => {
        if (pairingSocket !== socket) return;

        pairingSocket = null;

        setStatus(
          "Pairing connection closed. Create a new session.",
          "error"
        );
      };
    }

    // Computer creates a new pairing session
    $("computer-button").addEventListener(
      "click",
      async () => {
        const button = $("computer-button");

        button.disabled = true;
        setStatus("Creating pairing session...");

        try {
          const response = await fetch("/api/sessions", {
            method: "POST",
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error("Could not create session");
          }

          currentSession = await response.json();

          $("session-id").textContent =
            currentSession.sessionId;

          $("pairing-token").textContent =
            currentSession.pairingToken;

          $("session-expiry").textContent =
            new Date(
              currentSession.expiresAt
            ).toLocaleTimeString();

          showView("computer");

          // Establish real-time WebSocket connection
          connectWebSocket();

        } catch (error) {
          console.error(error);

          setStatus(
            "Session creation failed. Please try again.",
            "error"
          );
        } finally {
          button.disabled = false;
        }
      }
    );

    // Show the phone pairing form
    $("phone-button").addEventListener("click", () => {
      showView("phone");

      setStatus(
        "Enter the pairing details from your computer."
      );
    });

    // Phone joins the pairing session
    $("pairing-form").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const sessionId =
          $("phone-session-id")
            .value.trim().toLowerCase();

        const pairingToken =
          $("phone-token")
            .value.trim().toLowerCase();

        const button = $("join-button");
        button.disabled = true;

        setStatus("Connecting to computer...");

        try {
          const response = await fetch(
            `/api/sessions/${encodeURIComponent(sessionId)}/join`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                pairingToken
              }),
              cache: "no-store"
            }
          );

          if (!response.ok) {
            throw new Error("Pairing failed");
          }

          setStatus(
            "Success! Your phone has joined the pairing session.",
            "success"
          );

          $("pairing-form").hidden = true;

        } catch (error) {
          console.error(error);

          setStatus(
            "Could not pair. Check the details and try again.",
            "error"
          );

          button.disabled = false;
        }
      }
    );

    // Return to device selection
    $("back-button").addEventListener("click", () => {
      disconnectWebSocket();

      currentSession = null;

      $("pairing-form").reset();
      $("pairing-form").hidden = false;
      $("join-button").disabled = false;

      setStatus("Waiting for selection...");
      showView("selection");
    });

    // Close WebSocket when leaving the page
    window.addEventListener("pagehide", () => {
      disconnectWebSocket();
    });
  </script>
</body>
</html>
