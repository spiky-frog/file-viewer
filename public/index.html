
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Viewer</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 650px;
      margin: 70px auto;
      padding: 24px;
      text-align: center;
    }

    h1 { font-size: 32px; }

    .subtitle { color: #666; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-top: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    button {
      background: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      color: #666;
    }

    .details {
      margin-top: 20px;
      padding: 16px;
      background: #f5f5f7;
      border-radius: 10px;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .details p { margin: 8px 0; }

    .details code { font-size: 12px; }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main class="container">
    <h1>File Viewer</h1>
    <p class="subtitle">
      Send files from your phone to your computer.
    </p>

    <div class="card">
      <h2>Choose your device</h2>

      <div id="device-selection">
        <button id="computer-button">
          I'm on my computer
        </button>

        <button id="phone-button">
          I'm on my phone
        </button>
      </div>

      <p id="status">Waiting for selection...</p>

      <div id="session-details" class="details" hidden>
        <h3>Pairing session created</h3>

        <p>
          <strong>Session ID:</strong>
          <code id="session-id"></code>
        </p>

        <p>
          <strong>Expires:</strong>
          <span id="session-expiry"></span>
        </p>

        <p>
          Your session is ready. Phone pairing will be
          added in the next steps.
        </p>
      </div>
    </div>
  </main>

  <script>
    const computerButton =
      document.getElementById("computer-button");

    const phoneButton =
      document.getElementById("phone-button");

    const statusElement =
      document.getElementById("status");

    const sessionDetails =
      document.getElementById("session-details");

    computerButton.addEventListener("click", async () => {
      computerButton.disabled = true;
      sessionDetails.hidden = true;
      statusElement.textContent = "Creating pairing session...";

      try {
        const response = await fetch("/api/sessions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Session creation failed");
        }

        const session = await response.json();

        document.getElementById("session-id").textContent =
          session.sessionId;

        document.getElementById("session-expiry").textContent =
          new Date(session.expiresAt).toLocaleTimeString();

        statusElement.textContent = "Session created successfully!";
        sessionDetails.hidden = false;

        // Keep the pairing token in memory for later use.
        // Never put it in the URL or localStorage.
        window.currentSession = session;

      } catch (error) {
        statusElement.textContent =
          "Could not create a pairing session. Please try again.";

        console.error(error);
        computerButton.disabled = false;
      }
    });

    phoneButton.addEventListener("click", () => {
      statusElement.textContent =
        "Phone pairing will be available soon.";
    });
  </script>
</body>
</html>
